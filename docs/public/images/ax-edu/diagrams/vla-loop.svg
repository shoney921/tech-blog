<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="title desc">
<title id="title">VLA: 관찰과 지시를 로봇 행동으로</title><desc id="desc">개념 흐름 · 모델·로봇에 따라 구체 구성은 다름</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="750" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">VLA: 관찰과 지시를 로봇 행동으로</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">개념 흐름 · 모델·로봇에 따라 구체 구성은 다름</text>
<rect x="28" y="110" width="280" height="100" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="168.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">시각 관찰</text>
<text x="168.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">카메라 속 컵·접시</text>
<rect x="332" y="110" width="280" height="100" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="472.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">언어 지시</text>
<text x="472.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">“컵을 접시에 놓아”</text>
<polyline points="168,210 168,246 320,246 320,275" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="472,210 472,246 320,246" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="283" width="450" height="90" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="314" font-size="23" text-anchor="middle" font-weight="700" class="">VLA 모델</text>
<text x="320.0" y="342" font-size="20" text-anchor="middle" font-weight="400" class="">관찰·지시를 바탕으로 행동 출력</text>
<polyline points="320,373 320,405" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="413" width="450" height="90" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="444" font-size="23" text-anchor="middle" font-weight="700" class="">제어·안전 계층</text>
<text x="320.0" y="472" font-size="20" text-anchor="middle" font-weight="400" class="">행동을 실행 가능한 명령으로 적용</text>
<polyline points="320,503 320,535" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="543" width="450" height="90" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="574" font-size="23" text-anchor="middle" font-weight="700" class="">로봇 동작 → 환경 변화</text>
<text x="320.0" y="602" font-size="20" text-anchor="middle" font-weight="400" class="">컵을 잡고 옮김 → 다시 관찰</text>
<polyline points="95,588 12,588 12,160 26,160" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="680" font-size="19" text-anchor="start" font-weight="400" class="small">일부 모델은 관절 상태 등 추가 입력도 사용한다.</text>
<text x="28" y="707" font-size="19" text-anchor="start" font-weight="400" class="small">모델 출력과 실제 하드웨어 제어 사이의 검증이 필요하다.</text>
</svg>