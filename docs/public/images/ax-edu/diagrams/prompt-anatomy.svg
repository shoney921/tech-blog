<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">요청을 네 가지 정보로 구체화하기</title><desc id="desc">예시 과제: 회의록에서 후속 업무 추출</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="650" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">요청을 네 가지 정보로 구체화하기</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">예시 과제: 회의록에서 후속 업무 추출</text>
<rect x="28" y="108" width="584" height="65" rx="12" fill="#fae4df" stroke="#c5d5d4"/>
<text x="320.0" y="147.5" font-size="23" text-anchor="middle" font-weight="700" class="">모호한 요청: “회의록 정리해 줘”</text>
<polyline points="320,173 320,206" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="210" width="584" height="78" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="241" font-size="23" text-anchor="middle" font-weight="700" class="">역할 · 대상</text>
<text x="320.0" y="269" font-size="20" text-anchor="middle" font-weight="400" class="">팀에 공유할 업무 요약을 작성한다</text>
<rect x="28" y="300" width="584" height="78" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="331" font-size="23" text-anchor="middle" font-weight="700" class="">작업 · 자료</text>
<text x="320.0" y="359" font-size="20" text-anchor="middle" font-weight="400" class="">아래 회의록에서 후속 업무를 추출한다</text>
<rect x="28" y="390" width="584" height="78" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="421" font-size="23" text-anchor="middle" font-weight="700" class="">제약 · 불확실성</text>
<text x="320.0" y="449" font-size="20" text-anchor="middle" font-weight="400" class="">담당자·기한이 없으면 “미정”으로 표시한다</text>
<rect x="28" y="480" width="584" height="78" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="511" font-size="23" text-anchor="middle" font-weight="700" class="">출력 형식</text>
<text x="320.0" y="539" font-size="20" text-anchor="middle" font-weight="400" class="">업무 / 담당자 / 기한 순서의 표로 작성한다</text>
<text x="28" y="601" font-size="19" text-anchor="start" font-weight="400" class="small">구체적인 지시도 결과 검증을 대신하지는 않는다.</text>
</svg>