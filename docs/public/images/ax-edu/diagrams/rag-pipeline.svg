<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc">
<title id="title">RAG: 문서 준비와 질문 처리는 다르다</title><desc id="desc">벡터 검색을 사용하는 기본 구성 예시</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="770" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">RAG: 문서 준비와 질문 처리는 다르다</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">벡터 검색을 사용하는 기본 구성 예시</text>
<text x="28" y="120" font-size="22" text-anchor="start" font-weight="700" class="">미리 준비 · 문서가 바뀌면 갱신</text>
<rect x="28" y="141" width="164" height="88" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="110.0" y="172" font-size="23" text-anchor="middle" font-weight="700" class="">문서 분할</text>
<text x="110.0" y="200" font-size="20" text-anchor="middle" font-weight="400" class="">검색 단위로 나눔</text>
<rect x="238" y="141" width="164" height="88" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="172" font-size="23" text-anchor="middle" font-weight="700" class="">임베딩</text>
<text x="320.0" y="200" font-size="20" text-anchor="middle" font-weight="400" class="">벡터로 변환</text>
<rect x="448" y="141" width="164" height="88" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="530.0" y="172" font-size="23" text-anchor="middle" font-weight="700" class="">인덱스</text>
<text x="530.0" y="200" font-size="20" text-anchor="middle" font-weight="400" class="">원문·벡터 연결</text>
<polyline points="192,185 236,185" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="402,185 446,185" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="282" font-size="22" text-anchor="start" font-weight="700" class="">질문이 들어올 때</text>
<rect x="28" y="307" width="245" height="90" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="150.5" y="338" font-size="23" text-anchor="middle" font-weight="700" class="">질문 임베딩</text>
<text x="150.5" y="366" font-size="20" text-anchor="middle" font-weight="400" class="">같은 임베딩 공간</text>
<rect x="367" y="307" width="245" height="90" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="489.5" y="338" font-size="23" text-anchor="middle" font-weight="700" class="">관련 문서 검색</text>
<text x="489.5" y="366" font-size="20" text-anchor="middle" font-weight="400" class="">질문 벡터로 후보 탐색</text>
<polyline points="273,352 365,352" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="530,229 530,305" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="442" width="460" height="90" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="473" font-size="23" text-anchor="middle" font-weight="700" class="">컨텍스트 구성</text>
<text x="320.0" y="501" font-size="20" text-anchor="middle" font-weight="400" class="">질문 + 지시 + 검색된 원문</text>
<polyline points="490,397 490,419 320,419 320,440" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="90" y="578" width="460" height="90" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="609" font-size="23" text-anchor="middle" font-weight="700" class="">LLM 답변 생성</text>
<text x="320.0" y="637" font-size="20" text-anchor="middle" font-weight="400" class="">제공된 근거를 바탕으로 응답</text>
<polyline points="320,532 320,576" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="711" font-size="19" text-anchor="start" font-weight="400" class="small">검색 결과는 모델 입력에 추가된다.</text>
<text x="28" y="738" font-size="19" text-anchor="start" font-weight="400" class="small">이 과정 자체가 모델 가중치를 바꾸지는 않는다.</text>
</svg>