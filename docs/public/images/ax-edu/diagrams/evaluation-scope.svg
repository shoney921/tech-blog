<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">답이 맞아도 실행 과정에 문제가 있을 수 있다</title><desc id="desc">가상 주문 조회 사례 · 평가 관점 비교</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="650" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">답이 맞아도 실행 과정에 문제가 있을 수 있다</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">가상 주문 조회 사례 · 평가 관점 비교</text>
<rect x="28" y="110" width="584" height="70" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="152.0" font-size="23" text-anchor="middle" font-weight="700" class="">요청: 내 주문의 배송 상태를 알려 줘</text>
<rect x="28" y="220" width="280" height="150" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="168.0" y="251" font-size="23" text-anchor="middle" font-weight="700" class="">경로 A</text>
<text x="168.0" y="279" font-size="20" text-anchor="middle" font-weight="400" class="">내 주문만 조회</text>
<text x="168.0" y="306" font-size="20" text-anchor="middle" font-weight="400" class="">필요한 도구 1회</text>
<text x="168.0" y="333" font-size="20" text-anchor="middle" font-weight="400" class="">허용된 데이터만 사용</text>
<rect x="332" y="220" width="280" height="150" rx="12" fill="#fae4df" stroke="#c5d5d4"/>
<text x="472.0" y="251" font-size="23" text-anchor="middle" font-weight="700" class="">경로 B</text>
<text x="472.0" y="279" font-size="20" text-anchor="middle" font-weight="400" class="">전체 고객 주문 조회</text>
<text x="472.0" y="306" font-size="20" text-anchor="middle" font-weight="400" class="">불필요한 반복 호출</text>
<text x="472.0" y="333" font-size="20" text-anchor="middle" font-weight="400" class="">과도한 데이터 접근</text>
<polyline points="320,180 320,197 168,197 168,218" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="320,197 472,197 472,218" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="168,370 168,403 320,403 320,434" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="472,370 472,403 320,403" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="442" width="584" height="70" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="484.0" font-size="23" text-anchor="middle" font-weight="700" class="">같은 답변: “현재 배송 중입니다”</text>
<text x="28" y="554" font-size="19" text-anchor="start" font-weight="400" class="small">결과 평가 → 답변의 정확성·완전성</text>
<text x="28" y="581" font-size="19" text-anchor="start" font-weight="400" class="small">과정 평가 → 권한 준수·비용·오류 복구</text>
<text x="28" y="608" font-size="19" text-anchor="start" font-weight="400" class="small">정해진 도구 호출 순서와의 일치만으로 채점하지 않는다.</text>
</svg>