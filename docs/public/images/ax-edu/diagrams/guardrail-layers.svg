<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc">
<title id="title">가드레일은 실행 전에도 필요하다</title><desc id="desc">허용된 요청의 흐름 · 위험하면 각 지점에서 중단</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="770" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">가드레일은 실행 전에도 필요하다</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">허용된 요청의 흐름 · 위험하면 각 지점에서 중단</text>
<rect x="45" y="108" width="550" height="86" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="139" font-size="23" text-anchor="middle" font-weight="700" class="">외부 입력·검색 문서</text>
<text x="320.0" y="167" font-size="20" text-anchor="middle" font-weight="400" class="">출처와 신뢰 수준을 구분</text>
<polyline points="320,194 320,222" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="224" width="550" height="86" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="255" font-size="23" text-anchor="middle" font-weight="700" class="">입력 검사</text>
<text x="320.0" y="283" font-size="20" text-anchor="middle" font-weight="400" class="">민감정보·공격 징후·업무 범위 확인</text>
<polyline points="320,310 320,338" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="340" width="550" height="86" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="371" font-size="23" text-anchor="middle" font-weight="700" class="">모델의 행동 제안</text>
<text x="320.0" y="399" font-size="20" text-anchor="middle" font-weight="400" class="">도구명과 인자 생성</text>
<polyline points="320,426 320,454" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="456" width="550" height="86" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="487" font-size="23" text-anchor="middle" font-weight="700" class="">실행 전 권한 검사</text>
<text x="320.0" y="515" font-size="20" text-anchor="middle" font-weight="400" class="">최소 권한 / 위험 작업은 사람 승인</text>
<polyline points="320,542 320,570" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="572" width="550" height="86" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="603" font-size="23" text-anchor="middle" font-weight="700" class="">도구 실행 → 결과·응답 검사</text>
<text x="320.0" y="631" font-size="20" text-anchor="middle" font-weight="400" class="">유출·형식·근거를 점검한 후 전달</text>
<text x="28" y="724" font-size="19" text-anchor="start" font-weight="400" class="small">최종 답변을 가려도 이미 실행된 송금·삭제는 되돌릴 수 없다.</text>
</svg>