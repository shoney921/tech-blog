<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">컨텍스트는 수집보다 선별이 중요하다</title><desc id="desc">한 번의 모델 호출에 필요한 정보 구성</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="640" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">컨텍스트는 수집보다 선별이 중요하다</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">한 번의 모델 호출에 필요한 정보 구성</text>
<rect x="28" y="110" width="584" height="110" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">정보 후보</text>
<text x="320.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">시스템 지시 · 도구 정의 · 대화 이력</text>
<text x="320.0" y="196" font-size="20" text-anchor="middle" font-weight="400" class="">검색 문서 · 도구 결과 · 예제</text>
<polyline points="320,220 320,254" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="262" width="584" height="110" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="293" font-size="23" text-anchor="middle" font-weight="700" class="">선별 · 압축 · 갱신</text>
<text x="320.0" y="321" font-size="20" text-anchor="middle" font-weight="400" class="">관련 근거 선택 / 긴 이력 요약</text>
<text x="320.0" y="348" font-size="20" text-anchor="middle" font-weight="400" class="">중복 제거 / 오래된 상태 교체</text>
<polyline points="320,372 320,406" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="414" width="584" height="110" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="445" font-size="23" text-anchor="middle" font-weight="700" class="">이번 호출의 입력 컨텍스트</text>
<text x="320.0" y="473" font-size="20" text-anchor="middle" font-weight="400" class="">현재 목표와 필요한 근거를 함께 전달</text>
<text x="320.0" y="500" font-size="20" text-anchor="middle" font-weight="400" class="">모델 한도에 맞춰 생성 여유도 고려</text>
<text x="28" y="566" font-size="19" text-anchor="start" font-weight="400" class="small">다음 호출에서는 새 도구 결과와 상태를 반영한다.</text>
<text x="28" y="593" font-size="19" text-anchor="start" font-weight="400" class="small">구성 비율과 토큰 한도는 모델·작업에 따라 달라진다.</text>
</svg>