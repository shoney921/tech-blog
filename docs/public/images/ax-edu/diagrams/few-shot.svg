<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title desc">
<title id="title">예제는 모델에 어떤 패턴을 보여줄까?</title><desc id="desc">같은 분류 과제에 예제를 추가하는 방식</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="630" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">예제는 모델에 어떤 패턴을 보여줄까?</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">같은 분류 과제에 예제를 추가하는 방식</text>
<rect x="28" y="110" width="280" height="110" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="168.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">Zero-shot</text>
<text x="168.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">지시 + 새 입력</text>
<text x="168.0" y="196" font-size="20" text-anchor="middle" font-weight="400" class="">“배송이 빨라요” → ?</text>
<rect x="332" y="110" width="280" height="110" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="472.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">Few-shot</text>
<text x="472.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">지시 + 예제 + 새 입력</text>
<text x="472.0" y="196" font-size="20" text-anchor="middle" font-weight="400" class="">같은 분류 규칙을 보여 줌</text>
<polyline points="472,220 472,250" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="258" width="584" height="170" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="289" font-size="23" text-anchor="middle" font-weight="700" class="">프롬프트 안의 예제</text>
<text x="320.0" y="317" font-size="20" text-anchor="middle" font-weight="400" class="">“정말 만족해요” → 긍정</text>
<text x="320.0" y="344" font-size="20" text-anchor="middle" font-weight="400" class="">“제품이 깨졌어요” → 부정</text>
<text x="320.0" y="371" font-size="20" text-anchor="middle" font-weight="400" class="">“아직 사용 전이에요” → 중립</text>
<polyline points="320,428 320,460" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="468" width="584" height="76" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="499" font-size="23" text-anchor="middle" font-weight="700" class="">새 입력에 패턴 적용</text>
<text x="320.0" y="527" font-size="20" text-anchor="middle" font-weight="400" class="">“배송이 빨라요” → 긍정 (예시 응답)</text>
<text x="28" y="583" font-size="19" text-anchor="start" font-weight="400" class="small">예제를 입력에 넣는 것이며, 모델 가중치를 학습시키지 않는다.</text>
</svg>