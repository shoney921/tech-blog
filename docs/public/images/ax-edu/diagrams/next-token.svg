<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
<title id="title">문장은 다음 토큰을 고르며 자란다</title><desc id="desc">자기회귀 텍스트 생성의 핵심 흐름</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="690" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">문장은 다음 토큰을 고르며 자란다</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">자기회귀 텍스트 생성의 핵심 흐름</text>
<rect x="74" y="110" width="492" height="90" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">현재 입력</text>
<text x="320.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">사용자 입력 + 지금까지 생성한 토큰</text>
<rect x="74" y="232" width="492" height="90" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="263" font-size="23" text-anchor="middle" font-weight="700" class="">모델 계산</text>
<text x="320.0" y="291" font-size="20" text-anchor="middle" font-weight="400" class="">문맥을 반영한 다음 토큰 확률</text>
<rect x="74" y="354" width="492" height="90" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="385" font-size="23" text-anchor="middle" font-weight="700" class="">다음 토큰 선택</text>
<text x="320.0" y="413" font-size="20" text-anchor="middle" font-weight="400" class="">후보 분포에서 하나를 선택</text>
<rect x="74" y="476" width="492" height="90" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="507" font-size="23" text-anchor="middle" font-weight="700" class="">입력 뒤에 토큰 추가</text>
<text x="320.0" y="535" font-size="20" text-anchor="middle" font-weight="400" class="">종료 조건이면 멈추고, 아니면 반복</text>
<polyline points="320,200 320,232" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="320,322 320,354" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="320,444 320,476" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="566,521 603,521 603,155 566,155" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="610" font-size="19" text-anchor="start" font-weight="400" class="small">토큰은 단어와 항상 일치하지 않는다.</text>
<text x="28" y="637" font-size="19" text-anchor="start" font-weight="400" class="small">한 번에 완성된 문장을 꺼내는 과정이 아니다.</text>
</svg>