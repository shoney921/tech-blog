<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
<title id="title">DX·AX·RX를 층으로 이해하기</title><desc id="desc">시간 순서나 성숙도 점수를 나타내는 그래프가 아님</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52646b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18343b} .small{fill:#52646b}</style>
<rect width="640" height="620" rx="20" fill="#f8faf9"/>
<text x="28" y="42" font-size="27" text-anchor="start" font-weight="700" class="">DX·AX·RX를 층으로 이해하기</text>
<text x="28" y="76" font-size="18" text-anchor="start" font-weight="400" class="small">시간 순서나 성숙도 점수를 나타내는 그래프가 아님</text>
<rect x="95" y="110" width="450" height="110" rx="12" fill="#fff0cb" stroke="#c5d5d4"/>
<text x="320.0" y="141" font-size="23" text-anchor="middle" font-weight="700" class="">RX · 행동</text>
<text x="320.0" y="169" font-size="20" text-anchor="middle" font-weight="400" class="">화면에서 작업 수행</text>
<text x="320.0" y="196" font-size="20" text-anchor="middle" font-weight="400" class="">물리 세계에서 이동·조작</text>
<rect x="60" y="249" width="520" height="110" rx="12" fill="#dcefe9" stroke="#c5d5d4"/>
<text x="320.0" y="280" font-size="23" text-anchor="middle" font-weight="700" class="">AX · 지능</text>
<text x="320.0" y="308" font-size="20" text-anchor="middle" font-weight="400" class="">디지털 정보를 바탕으로</text>
<text x="320.0" y="335" font-size="20" text-anchor="middle" font-weight="400" class="">인식·예측·생성·판단</text>
<rect x="28" y="388" width="584" height="110" rx="12" fill="#e4edf8" stroke="#c5d5d4"/>
<text x="320.0" y="419" font-size="23" text-anchor="middle" font-weight="700" class="">DX · 디지털 기반</text>
<text x="320.0" y="447" font-size="20" text-anchor="middle" font-weight="400" class="">문서·업무·현장 정보를</text>
<text x="320.0" y="474" font-size="20" text-anchor="middle" font-weight="400" class="">데이터와 시스템으로 연결</text>
<polyline points="320,388 320,361" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="320,249 320,222" fill="none" stroke="#52646b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="543" font-size="19" text-anchor="start" font-weight="400" class="small">아래 기반 위에 지능과 행동 능력을 더하는 관점이다.</text>
<text x="28" y="570" font-size="19" text-anchor="start" font-weight="400" class="small">세 영역은 함께 운영되고 개선될 수 있다.</text>
</svg>